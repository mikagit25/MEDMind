networks:
  default:
    name: medmind_default

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: medmind_postgres
    environment:
      POSTGRES_USER: medmind
      POSTGRES_PASSWORD: medmind_secret
      POSTGRES_DB: medmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/DB_SCHEMA.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmind -d medmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medmind_redis
    command: redis-server --appendonly yes --requirepass medmind_redis_secret
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "medmind_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medmind_backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://medmind:medmind_secret@postgres:5432/medmind
      REDIS_URL: redis://:medmind_redis_secret@redis:6379/0
    volumes:
      - ./backend:/app
      - ./Modules:/app/data/modules:ro
      - media_data:/app/data/media   # persistent storage for uploaded images
      - /opt/medmind/youtube_token.json:/app/youtube_token_en.json
      - /opt/medmind/youtube_token_account2.json:/app/youtube_token_es.json
      - /opt/medmind/youtube_token_ar.json:/app/youtube_token_ar.json
      - /opt/kids_channel/credentials/youtube_token.json:/app/youtube_token_kids.json
      - /opt/kids_channel/credentials/youtube_token_ar.json:/app/youtube_token_kids_ar.json
      - /opt/kids_channel/credentials/youtube_token_id.json:/app/youtube_token_kids_id.json
      - /opt/kids_channel/credentials/client_secret_kids_web.json:/app/client_secret_kids_web.json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        INTERNAL_API_BASE: http://backend:8000
    container_name: medmind_frontend
    environment:
      PORT: "3000"
      # Server-side only (not NEXT_PUBLIC) — used for SSR/sitemap fetches inside Docker network
      BACKEND_URL: http://backend:8000/api/v1
      INTERNAL_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_SITE_URL: https://medmind.pro
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:   # uploaded medical images, thumbnails, DICOM exports
