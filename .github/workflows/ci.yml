name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check app/ --select E,W,F,I --ignore E501

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions!!
          ENCRYPTION_KEY: ""
          ENVIRONMENT: development
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

  # ── E2E Smoke Tests (blocks deploy on failure) ──────────────────────────────
  e2e:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: medmind
          POSTGRES_PASSWORD: medmind_secret
          POSTGRES_DB: medmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── Python / Backend ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run DB migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://medmind:medmind_secret@localhost:5432/medmind
          JWT_SECRET_KEY: ci-e2e-secret
          ENVIRONMENT: development
        run: alembic upgrade head

      - name: Import modules
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://medmind:medmind_secret@localhost:5432/medmind
          JWT_SECRET_KEY: ci-e2e-secret
          ENVIRONMENT: development
          MODULES_DIR: ../Modules
        run: python -m app.scripts.import_modules || true

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://medmind:medmind_secret@localhost:5432/medmind
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-e2e-secret
          ENCRYPTION_KEY: ""
          ENVIRONMENT: development
          ANTHROPIC_API_KEY: sk-ant-placeholder
          GROQ_API_KEY: gsk_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        shell: bash

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done

      # ── Node / Frontend ───────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          PORT: "3000"
        run: npm start &
        shell: bash

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            echo "Waiting for frontend ($i/30)..."
            sleep 2
          done

      # ── Seed & Playwright ─────────────────────────────────────────────────
      - name: Seed E2E data
        run: python3 scripts/e2e_seed.py || true

      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/chromium-browser
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npx playwright test --reporter=github

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ── SEO Audit (allowed to fail — runs against prod only on push to main) ────
  seo-audit:
    name: SEO Audit (sitemaps + hreflang)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true  # allowed-to-fail per roadmap spec

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run SEO audit
        run: python scripts/ops/seo_audit.py --site https://medmind.pro --max-urls 100
        continue-on-error: true

  # ── Deploy (runs only on push to main, after E2E green) ─────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/medmind
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec backend \
              python -m app.scripts.import_modules
            echo "✅ Deploy complete"
